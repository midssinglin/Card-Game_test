name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 build.py
      - name: Check docs/ is up to date
        run: git diff --exit-code -- docs/index.html || (echo "docs/ is out of date: run python3 build.py and commit" && exit 1)
      - name: Tests
        run: npm test
